global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts/*.rules.yml

scrape_configs:
  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: "gateway"
          env: "local"

  - job_name: "transaction"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: "transaction"
          env: "local"

  - job_name: "inventory"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          service: "inventory"
          env: "local"

  - job_name: "ai-auditor"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8083"]
        labels:
          service: "ai-auditor"
          env: "local"

  - job_name: "worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9094"]
        labels:
          service: "worker"
          env: "local"