global:
  resolve_timeout: 5m

route:
  receiver: local-webhook
  group_by: ["alertname", "severity", "category"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 2h

receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://host.docker.internal:18080/alerts
        send_resolved: true